# Pin a dedicated Compose project name. Without it this file derives the same
# project name as docker-compose.yml from the checkout directory, so a
# `down -v --remove-orphans` here would tear down the production stack.
name: automatizacion-whatsapp-test

services:
  postgres:
    image: ${POSTGRES_IMAGE:-postgres:16.13-alpine}
    environment:
      POSTGRES_DB: ${TEST_POSTGRES_DB:-testdb}
      POSTGRES_USER: ${TEST_POSTGRES_USER:-test}
      POSTGRES_PASSWORD: ${TEST_POSTGRES_PASSWORD:-test}
    # Reserved 55xxx range. The production stack publishes POSTGRES_PORT (5433 in
    # the current .env), so sharing that default made the test stack fail to bind.
    ports:
      - "${TEST_POSTGRES_PORT:-55433}:5432"
    volumes:
      - postgres_test_data:/var/lib/postgresql/data
      - ./infra/postgres/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          test "$$(head -n 1 /var/lib/postgresql/data/postmaster.pid 2>/dev/null)" = "1" &&
          pg_isready -U ${TEST_POSTGRES_USER:-test} -d ${TEST_POSTGRES_DB:-testdb}
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s

  n8n:
    image: ${N8N_IMAGE:-docker.n8n.io/n8nio/n8n:1.123.29}
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: ${TEST_POSTGRES_DB:-testdb}
      DB_POSTGRESDB_USER: ${TEST_POSTGRES_USER:-test}
      DB_POSTGRESDB_PASSWORD: ${TEST_POSTGRES_PASSWORD:-test}
      DB_POSTGRESDB_SCHEMA: public
      N8N_BASIC_AUTH_ACTIVE: "false"
      N8N_HOST: localhost
      N8N_PORT: 5678
      N8N_PROTOCOL: http
      WEBHOOK_URL: http://localhost:5678/
      N8N_ENCRYPTION_KEY: test-only-encryption-key-do-not-use-in-production
      N8N_SECURE_COOKIE: "false"
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_RUNNERS_ENABLED: "true"
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"
      NODE_FUNCTION_ALLOW_BUILTIN: crypto,fs,path
      GENERIC_TIMEZONE: America/Santiago
      TZ: America/Santiago
      EVOLUTION_WEBHOOK_SECRET: test-secret
      EVOLUTION_API_BASE_URL: http://mock-evolution:8080
      EVOLUTION_API_KEY: test-key
      EVOLUTION_DEFAULT_INSTANCE: test-instance
      CLICKUP_WEBHOOK_SECRET: ${TEST_CLICKUP_WEBHOOK_SECRET:-test-clickup-webhook-secret}
      CLICKUP_STATUS_ACKNOWLEDGED: ${TEST_CLICKUP_STATUS_ACKNOWLEDGED:-in progress,en progreso,en curso}
      CLICKUP_STATUS_RESOLVED: ${TEST_CLICKUP_STATUS_RESOLVED:-complete,completed,closed,done,cerrado,resuelto}
      AI_LEAD_ASSISTANT_ENABLED: ${TEST_AI_LEAD_ASSISTANT_ENABLED:-false}
      AI_PROVIDER: ${TEST_AI_PROVIDER:-mock}
      AI_DIRECT_API_BASE_URL: ${TEST_AI_DIRECT_API_BASE_URL:-http://mock-ai:8081}
      AI_DIRECT_API_PATH: ${TEST_AI_DIRECT_API_PATH:-/chat/completions}
      AI_DIRECT_API_KEY: ${TEST_AI_DIRECT_API_KEY:-test-ai-key}
      AI_DIRECT_API_MODEL: ${TEST_AI_DIRECT_API_MODEL:-test-ai-model}
      AI_DIRECT_API_MAX_ATTEMPTS: ${TEST_AI_DIRECT_API_MAX_ATTEMPTS:-1}
      # Rollout del contrato conversacional versionado: legacy | shadow | canary | enforce.
      # Por defecto legacy, de modo que v3 permanece inerte salvo que la prueba lo pida.
      AI_PRD_CONTRACT_MODE: ${TEST_AI_PRD_CONTRACT_MODE:-legacy}
      FOLLOW_UP_FIRST_DELAY_HOURS: 24
      OUTBOUND_CLAIM_STALE_SECONDS: 300
    # Reserved 55xxx range; production publishes N8N_PORT (5678) on the host.
    ports:
      - "${TEST_N8N_PORT:-55678}:5678"
    depends_on:
      postgres:
        condition: service_healthy
      mock-evolution:
        condition: service_healthy
      mock-ai:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:5678/healthz/readiness || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s

  mock-evolution:
    image: node:20.19.4-alpine
    ports:
      - "${TEST_MOCK_EVOLUTION_PORT:-58080}:8080"
    command:
      - node
      - -e
      - |
        const http = require('node:http');
        const requests = [];
        const server = http.createServer((request, response) => {
          response.setHeader('content-type', 'application/json');
          if (request.url === '/health') {
            response.end(JSON.stringify({ status: 'ok' }));
            return;
          }
          if (request.method === 'GET' && request.url === '/requests') {
            response.end(JSON.stringify({ count: requests.length, requests }));
            return;
          }
          if (request.method === 'POST' && request.url.startsWith('/message/sendText/')) {
            const chunks = [];
            request.on('data', (chunk) => chunks.push(chunk));
            request.on('end', () => {
              const body = Buffer.concat(chunks).toString('utf8');
              const responseId = 'synthetic-message-id-' + (requests.length + 1);
              requests.push({
                method: request.method,
                url: request.url,
                body,
                parsed_body: JSON.parse(body),
                response_id: responseId,
              });
              response.end(JSON.stringify({ success: true, key: { id: responseId } }));
            });
            return;
          }
          response.statusCode = 404;
          response.end(JSON.stringify({ error: 'not_found' }));
        });
        server.listen(8080, '0.0.0.0');
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/health"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  mock-ai:
    image: node:20.19.4-alpine
    environment:
      PORT: 8081
    ports:
      - "${TEST_MOCK_AI_PORT:-58081}:8081"
    volumes:
      - ./tests/fixtures/mock-ai-server.mjs:/app/mock-ai-server.mjs:ro
    command: ["node", "/app/mock-ai-server.mjs"]
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8081/health"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

volumes:
  postgres_test_data:
